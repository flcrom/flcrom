name: profile stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/stats.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit if changed
        run: |
          git add assets/stats.svg assets/projects.svg
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git -c user.name="Vardhman Bengani" -c user.email="161213233+flcrom@users.noreply.github.com" commit -m "update profile stats"
          git push
